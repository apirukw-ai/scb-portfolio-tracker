name: Auto Update SCB NAVs

on:
  schedule:
    # รอบที่ 1: รันอัตโนมัติทุกวันจันทร์ - ศุกร์ เวลา 20:30 น. (เวลาไทย)
    - cron: '30 13 * * 1-5'
    
    # รอบที่ 2: รันอัตโนมัติทุกวันจันทร์ - ศุกร์ เวลา 20:45 น. (เวลาไทย)
    - cron: '45 13 * * 1-5'

  workflow_dispatch: # ปุ่มกดรันด้วยมือเพื่อทดสอบ

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 supabase

      - name: Run Update NAV Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_nav.py
