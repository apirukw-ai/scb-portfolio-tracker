name: Auto Update SCB NAVs

on:
  schedule:
    # รอบที่ 1: รันอัตโนมัติทุกวันจันทร์ - เสาร์ เวลา 10:05 น. (เวลาไทย)
    - cron: '5 3 * * 1-6'
    
    # รอบที่ 2: รันอัตโนมัติทุกวันจันทร์ - เสาร์ เวลา 20:30 น. (เวลาไทย)
    - cron: '30 13 * * 1-6'
    
    # รอบที่ 3: รันอัตโนมัติทุกวันจันทร์ - เสาร์ เวลา 20:45 น. (เวลาไทย)
    - cron: '45 13 * * 1-6'

  workflow_dispatch: # ปุ่มกดรันด้วยมือเพื่อทดสอบ

# ให้สิทธิ์ GitHub Action บันทึกไฟล์กลับลง Repository
permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run NAV Update Script
        run: python update_nav.py

      # 📌 ขั้นตอนสำคัญ: บันทึกและ Push ข้อมูลใหม่กลับเข้าเว็บ
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Auto-update NAVs [skip ci]" || exit 0
          git push
