name: Auto Update SCB NAVs

on:
  schedule:
    # รันอัตโนมัติทุกวันจันทร์ - ศุกร์ เวลา 20:30 น. (เวลาไทย)
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # ปุ่มกดรันด้วยมือเพื่อทดสอบ

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run NAV Update Script
        run: python update_nav.py
