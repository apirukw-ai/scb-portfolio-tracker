name: Auto Update SCB NAVs

on:
  schedule:
    # รอบที่ 1: รันอัตโนมัติทุกวันจันทร์ - ศุกร์ เวลา 20:30 น. (เวลาไทย)
    - cron: '30 13 * * 1-5'
    
    # รอบที่ 2: รันอัตโนมัติทุกวันจันทร์ - ศุกร์ เวลา 20:45 น. (เวลาไทย)
    - cron: '45 13 * * 1-5'

  workflow_dispatch: # ปุ่มกดรันด้วยมือเพื่อทดสอบ

# ให้สิทธิ์ GitHub Action บันทึกไฟล์กลับลง Repository
permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 firebase-admin

      # 📍 แทรกสร้างไฟล์ Key จาก GitHub Secret
      - name: Create Firebase Service Account Key JSON
        run: |
          echo '${{ secrets.FIREBASE_KEY }}' > serviceAccountKey.json

      # 📍 สั่งรันสคริปต์อัปเดต NAV (เหลือรอบเดียว)
      - name: Run Update NAV Script
        run: python update_nav.py

      # 📌 บันทึกและ Push เฉพาะไฟล์ที่ต้องการ (ไม่เอา serviceAccountKey.json)
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git rm --cached serviceAccountKey.json || true
          git add index.html
          git commit -m "Auto-update NAVs [skip ci]" || exit 0
          git push

      # 📍 ลบไฟล์ Key ทิ้งหลังจบกระบวนการเพื่อความปลอดภัย
      - name: Clean up Key
        if: always()
        run: rm -f serviceAccountKey.json
